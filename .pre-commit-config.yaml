repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.9.18
    hooks:
      - id: uv-lock
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black-jupyter
        language_version: python3.14
        args: [--target-version, py314]
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-isort
        additional_dependencies: [isort==8.0.1]

